<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - PAC Fatayat NU Kemang</title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    
    <!-- Google Fonts: Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'utama': '#00984a',
                        'utama-gelap': '#007a3b',
                        'putih-tema': '#FFF2F2',
                        'abu-hijau': '#E8F5E9',
                    }
                }
            }
        }
    </script>
    
    <style>
        .btn-loader {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-abu-hijau/40 text-gray-800 antialiased font-sans flex flex-col min-h-screen justify-between">

    <header class="bg-white border-b-2 border-utama py-3.5 px-4 md:px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-3">
                <img src="../assets/img/logo.png" alt="Logo Fatayat NU" class="h-9 w-auto object-contain" onerror="this.src='https://via.placeholder.com/100x100/00984a/ffffff?text=LOGO'">
                <div class="flex flex-col">
                    <span class="font-display font-bold text-sm md:text-base text-gray-900 leading-none">PANEL PENGURUS</span>
                    <span class="text-[10px] font-semibold text-utama tracking-widest uppercase mt-1">PAC Fatayat NU Kemang</span>
                </div>
            </a>
            <a href="../index.html" class="text-xs font-semibold text-utama hover:underline uppercase tracking-wider flex items-center gap-1">
                <span>&larr;</span>
                <span>Ke Beranda Publik</span>
            </a>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-12">
        <div class="bg-white border-y-2 border-x border-utama p-6 sm:p-8">
            <div class="pb-4 mb-6 border-b border-utama/30 text-center">
                <img src="../assets/img/logo.png" alt="Logo" class="h-16 w-auto mx-auto mb-3 object-contain" onerror="this.style.display='none'">
                <h1 class="font-display font-bold text-xl text-gray-900 uppercase tracking-tight">Autentikasi Admin</h1>
                <p class="text-xs text-gray-500 mt-1">Masuk untuk mengelola artikel berita dan galeri kegiatan</p>
            </div>

            <div id="login-alert" class="hidden mb-6 p-3.5 text-xs font-medium border-l-4"></div>

            <form id="form-login" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Masukkan username admin"
                        class="w-full px-3 py-2.5 bg-putih-tema/40 border-b-2 border-gray-300 focus:border-utama focus:bg-abu-hijau/30 text-sm outline-none transition-colors">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-gray-800 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Masukkan password"
                        class="w-full px-3 py-2.5 bg-putih-tema/40 border-b-2 border-gray-300 focus:border-utama focus:bg-abu-hijau/30 text-sm outline-none transition-colors">
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-login" class="w-full py-3.5 bg-utama hover:bg-utama-gelap text-white font-semibold text-xs uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
                        <span id="btn-text">Masuk ke Dashboard</span>
                        <div id="btn-loader" class="hidden btn-loader"></div>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-utama/30 py-4 px-4 text-center text-[11px] text-gray-500">
        &copy; 2026 Sistem Informasi Manajemen Berita — PAC Fatayat NU Kecamatan Kemang.
    </footer>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNpKmlXAylAWhl9Qay1B7-74q0AaCQKOuNf4Pz_i8RrIfpaxRdnFjWAgy5CwYg2Pcq/exec';

        document.addEventListener('DOMContentLoaded', () => {
            const formLogin = document.getElementById('form-login');
            const alertBox = document.getElementById('login-alert');

            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btnLogin = document.getElementById('btn-login');
                const btnText = document.getElementById('btn-text');
                const btnLoader = document.getElementById('btn-loader');

                btnText.textContent = 'Memverifikasi...';
                btnLoader.classList.remove('hidden');
                btnLogin.disabled = true;
                alertBox.classList.add('hidden');

                const params = new URLSearchParams();
                params.append('action', 'login');
                params.append('username', document.getElementById('username').value);
                params.append('password', document.getElementById('password').value);

                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: params
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        localStorage.setItem('fatayat_admin', JSON.stringify(result.data));
                        window.location.href = 'dashboard.html';
                    } else {
                        throw new Error(result.message || 'Username atau password salah.');
                    }
                } catch (error) {
                    alertBox.textContent = error.message || 'Gagal terhubung ke server.';
                    alertBox.className = 'block mb-6 p-3.5 text-xs font-medium bg-putih-tema text-red-700 border-l-4 border-red-600';
                    btnText.textContent = 'Masuk ke Dashboard';
                    btnLoader.classList.add('hidden');
                    btnLogin.disabled = false;
                }
            });
        });
    </script>
</body>
</html>

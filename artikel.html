<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- OG_META_START (Dinamis untuk WhatsApp & Media Sosial) -->
    <title id="meta-title">Baca Artikel - PAC Fatayat NU Kecamatan Kemang</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <meta id="meta-desc" name="description" content="Portal berita dan informasi resmi PAC Fatayat Nahdlatul Ulama Kecamatan Kemang, Kabupaten Bogor.">
    
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="PAC Fatayat NU Kemang">
    <meta id="og-title" property="og:title" content="Warta PAC Fatayat NU Kecamatan Kemang">
    <meta id="og-desc" property="og:description" content="Portal berita dan informasi resmi PAC Fatayat Nahdlatul Ulama Kecamatan Kemang, Kabupaten Bogor.">
    <meta id="og-image" property="og:image" content="https://via.placeholder.com/800x450/00984a/ffffff?text=PAC+Fatayat+NU+Kemang">
    
    <meta name="twitter:card" content="summary_large_image">
    <!-- OG_META_END -->
    
    <!-- Google Fonts: Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'utama': '#00984a',
                        'utama-gelap': '#007a3b',
                        'putih-tema': '#FFF2F2',
                        'abu-hijau': '#E8F5E9',
                    }
                }
            }
        }
    </script>
    
    <style>
        .css-loader {
            border: 2px solid #E8F5E9;
            border-top: 2px solid #00984a;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .isi-artikel p {
            margin-bottom: 1.25rem;
            line-height: 1.85;
        }
        @media print {
            nav, footer, aside, .no-print { display: none !important; }
            main { width: 100% !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-white text-gray-800 antialiased font-sans flex flex-col min-h-screen">

    <!-- 1. TOP BAR -->
    <div class="bg-abu-hijau text-gray-700 text-xs py-2 px-4 md:px-8 border-b border-utama/20">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-4 md:gap-6">
                <span>Kecamatan Kemang, Kabupaten Bogor 16310</span>
                <span class="hidden sm:inline text-utama">|</span>
                <span>0812-3456-7890</span>
            </div>
            <div class="font-semibold text-utama tracking-wide uppercase text-[11px] hidden sm:block">
                PAC Fatayat NU Kemang
            </div>
        </div>
    </div>

    <!-- 2. NAVBAR -->
    <nav class="bg-white sticky top-0 z-50 border-b-2 border-utama">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-3.5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <img src="assets/img/logo.png" alt="Logo Fatayat NU" class="h-10 md:h-11 w-auto object-contain" onerror="this.src='https://via.placeholder.com/100x100/00984a/ffffff?text=LOGO'">
                <div class="flex flex-col">
                    <span class="font-display font-bold text-base md:text-lg text-gray-900 leading-none">PAC FATAYAT NU</span>
                    <span class="text-[11px] font-semibold text-utama tracking-widest uppercase mt-1">Kecamatan Kemang</span>
                </div>
            </a>
            <div class="hidden md:flex items-center gap-7 text-sm font-medium text-gray-700">
                <a href="index.html" class="hover:text-utama transition-colors pb-1">Beranda</a>
                <a href="admin/login.html" class="bg-utama hover:bg-utama-gelap text-white font-semibold text-xs px-5 py-2.5 transition-colors uppercase tracking-wider">Login</a>
            </div>
        </div>
    </nav>

    <!-- 3. KONTEN ARTIKEL -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 py-10 md:py-16">
        <div class="no-print pb-4 mb-8 border-b border-gray-200 flex items-center justify-between text-xs">
            <a href="index.html" class="text-utama font-semibold uppercase tracking-wider hover:underline flex items-center gap-1.5">
                <span>&larr;</span>
                <span>Kembali ke Beranda</span>
            </a>
            <span class="text-gray-400 uppercase tracking-widest">Warta Fatayat Kemang</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Kolom Kiri: Detail Artikel Utama -->
            <div class="lg:col-span-8 lg:border-r lg:border-utama/30 lg:pr-10" id="detail-artikel-container">
                <div class="flex flex-col items-center justify-center py-20">
                    <div class="css-loader mb-3"></div>
                    <div class="text-xs uppercase tracking-widest text-gray-500">Memuat Isi Artikel...</div>
                </div>
            </div>

            <!-- Kolom Kanan: Berita Terpopuler -->
            <aside class="no-print lg:col-span-4">
                <div class="pb-3 mb-6 border-b-2 border-utama">
                    <h3 class="text-base font-display font-bold text-gray-900 uppercase tracking-wider">Terpopuler</h3>
                </div>
                <div class="space-y-5" id="terpopuler-container">
                    <div class="py-6 text-xs text-gray-400">Memuat daftar berita...</div>
                </div>
            </aside>
        </div>
    </main>

    <!-- 4. FOOTER -->
    <footer class="bg-abu-hijau border-t-2 border-utama text-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-6 text-center text-[11px] text-gray-600">
            &copy; 2026 Pimpinan Anak Cabang Fatayat Nahdlatul Ulama Kecamatan Kemang.
        </div>
    </footer>

    <!-- SCRIPT ARTIKEL & FITUR SHARE DENGAN API PREVIEW -->
    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNpKmlXAylAWhl9Qay1B7-74q0AaCQKOuNf4Pz_i8RrIfpaxRdnFjWAgy5CwYg2Pcq/exec';

        const urlParams = new URLSearchParams(window.location.search);
        const targetSlug = urlParams.get('slug') || urlParams.get('id');

        let currentFontSize = 16; 

        async function loadDetailArtikel() {
            const container = document.getElementById('detail-artikel-container');
            const populerContainer = document.getElementById('terpopuler-container');

            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=berita`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="py-10 text-sm text-gray-500">Data artikel belum tersedia.</div>';
                    return;
                }

                let artikel = data.find(item => String(item.slug || item.ID || '').trim() === String(targetSlug).trim());
                if (!artikel) {
                    artikel = data[data.length - 1];
                }

                const judul = artikel.judul || artikel.Judul || 'Tanpa Judul';
                const kategori = artikel.kategori || artikel.Kategori || 'Kegiatan';
                const penulis = artikel.penulis || artikel.Penulis || 'Media PAC Fatayat Kemang';
                const isi = artikel.konte || artikel.Isi_Berita || artikel.ringkasan || '';
                const imgUrl = artikel.gambar_url || artikel.Link_Gambar || '';
                const namaDokumentasi = artikel.nama_dokumentasi || `Dokumentasi ${judul} (Tim Infokom PAC Fatayat Kemang)`;
                const cuplikanText = isi.substring(0, 120) + '...';
                const itemSlug = artikel.slug || artikel.ID || targetSlug;

                // UPDATE META TAG
                document.getElementById('meta-title').textContent = `${judul} - PAC Fatayat NU Kemang`;
                document.getElementById('meta-desc').setAttribute('content', cuplikanText);
                document.getElementById('og-title').setAttribute('content', judul);
                document.getElementById('og-desc').setAttribute('content', cuplikanText);
                document.getElementById('og-image').setAttribute('content', imgUrl);

                let tgl = new Date(artikel.tanggal || artikel.Tanggal).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
                if (tgl === 'Invalid Date') tgl = artikel.tanggal || artikel.Tanggal || '-';

                const paragrafIsi = isi.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p}</p>`).join('');
                
// URL Preview untuk dibagikan agar card WhatsApp muncul dengan sempurna
                const previewShareUrl = `https://fatayatkemang.// URL Preview untuk dibagikan agar card WhatsApp muncul dengan sempurna
                const previewShareUrl = `https://fatayatkemang.my.id/api/preview?slug=${itemSlug}`;
                const encodedShareUrl = encodeURIComponent(previewShareUrl);/api/preview?slug=${itemSlug}`;
                const encodedShareUrl = encodeURIComponent(previewShareUrl);

                container.innerHTML = `
                    <article>
                        <div class="mb-6 pb-6 border-b-2 border-utama">
                            <span class="inline-block text-xs font-bold uppercase tracking-widest text-utama mb-2">${kategori}</span>
                            <h1 class="font-display font-extrabold text-2xl sm:text-3xl md:text-4xl text-gray-900 leading-tight mb-4">
                                ${judul}
                            </h1>
                            <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-gray-100 text-xs text-gray-500">
                                <div class="flex items-center gap-3">
                                    <span>Oleh: <strong class="text-gray-800">${penulis}</strong></span>
                                    <span class="text-utama">|</span>
                                    <span>${tgl}</span>
                                </div>
                            </div>
                        </div>

                        <!-- TOMBOL SOSIAL MEDIA IKON -->
                        <div class="no-print flex items-center gap-3 mb-6">
                            <!-- Facebook -->
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodedShareUrl}" target="_blank" title="Bagikan ke Facebook" class="w-11 h-11 border border-gray-300 rounded-lg flex items-center justify-center text-gray-700 hover:border-utama hover:text-utama transition-colors bg-white shadow-sm">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
                            </a>
                            <!-- WhatsApp -->
                            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(`*${judul}*\n\nBaca selengkapnya:\n${previewShareUrl}`)}" target="_blank" title="Bagikan ke WhatsApp" class="w-11 h-11 border border-gray-300 rounded-lg flex items-center justify-center text-gray-700 hover:border-utama hover:text-utama transition-colors bg-white shadow-sm">
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            </a>
                            <!-- Salin Link -->
                            <button onclick="salinLink()" title="Salin Tautan" class="w-11 h-11 border border-gray-300 rounded-lg flex items-center justify-center text-gray-700 hover:border-utama hover:text-utama transition-colors bg-white shadow-sm">
                                <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                            </button>
                            <!-- Tombol A+ -->
                            <button onclick="perbesarHuruf()" title="Perbesar Ukuran Teks" class="w-11 h-11 bg-[#b91c1c] hover:bg-[#991b1b] text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-sm transition-colors">
                                A+
                            </button>
                        </div>

                        <div class="mb-2">
                            <img src="${imgUrl}" alt="${judul}" class="w-full max-h-[460px] object-cover border border-gray-200" onerror="this.style.display='none'">
                        </div>
                        <div class="text-[11px] text-gray-500 italic mb-8 pb-4 border-b border-gray-200">
                            ${namaDokumentasi}
                        </div>

                        <div id="konten-teks-artikel" class="isi-artikel text-gray-800 text-sm sm:text-base leading-relaxed text-justify pb-8 border-b border-gray-200" style="font-size: 16px;">
                            ${paragrafIsi || '<p>Isi berita belum tersedia.</p>'}
                        </div>

                        <!-- AUTHOR BOX -->
                        <div class="p-5 bg-putih-tema/50 border-l-4 border-utama flex items-center gap-4 mt-6">
                            <div class="w-12 h-12 bg-utama text-white font-bold flex items-center justify-center text-lg uppercase rounded-full">
                                ${penulis.charAt(0)}
                            </div>
                            <div>
                                <span class="text-[10px] font-bold text-utama uppercase tracking-widest block">Penulis Berita</span>
                                <h4 class="font-display font-bold text-sm text-gray-900">${penulis}</h4>
                                <p class="text-xs text-gray-600 mt-0.5">Tim Redaksi & Publikasi Resmi Pimpinan Anak Cabang Fatayat NU Kecamatan Kemang.</p>
                            </div>
                        </div>
                    </article>
                `;

                populerContainer.innerHTML = '';
                data.slice().reverse().slice(0, 5).forEach((item, index) => {
                    const slugItem = item.slug || item.ID || '';
                    const judulItem = item.judul || item.Judul;
                    if (!judulItem) return;

                    populerContainer.innerHTML += `
                        <div class="flex items-start gap-4 group">
                            <span class="font-display font-bold text-xl text-gray-300 group-hover:text-utama transition-colors">0${index + 1}</span>
                            <div>
                                <a href="artikel.html?slug=${slugItem}" class="font-display font-bold text-xs sm:text-sm text-gray-900 group-hover:text-utama transition-colors leading-snug block line-clamp-2">
                                    ${judulItem}
                                </a>
                                <span class="text-[10px] text-gray-400 mt-1 block">${item.kategori || item.Kategori || 'Kegiatan'}</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                container.innerHTML = '<div class="py-6 px-4 text-xs text-gray-700 bg-putih-tema border-l-4 border-utama">Gagal memuat berita dari server.</div>';
            }
        }

        function salinLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Tautan artikel berhasil disalin ke clipboard!');
            });
        }

        function perbesarHuruf() {
            currentFontSize += 2;
            if (currentFontSize > 24) currentFontSize = 16; 
            const konten = document.getElementById('konten-teks-artikel');
            if (konten) {
                konten.style.fontSize = currentFontSize + 'px';
            }
        }

        document.addEventListener("DOMContentLoaded", loadDetailArtikel);
    </script>
</body>
</html>
